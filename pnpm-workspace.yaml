packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
saveExact: true
workspaceConcurrency: 1

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  esbuild: true
  expo-superwall: true
  fsevents: true
  unrs-resolver: true
  workerd: true

overrides:
  react: 19.3.0
  react-dom: 19.3.0
  test-renderer: 1.3.1
  react-native: 0.88.1
  glob: 14.0.4
  minimatch: 11.0.5
  test-exclude@6>glob: 7.2.3
  test-exclude@6>minimatch: 3.1.5
  # drizzle-kit 0.31.11, the latest stable release, still depends on the
  # deprecated @esbuild-kit/esm-loader, whose core-utils pins esbuild ~0.18.20
  # (GHSA-67mh-4wv8-2f99, Dependabot alert #5). Its bundle never loads that
  # loader, and only drizzle-kit 1.0 drops it, so lift that esbuild to the one
  # drizzle-kit itself uses. Remove this when drizzle-kit no longer needs it.
  '@esbuild-kit/core-utils>esbuild': 0.25.12

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.21'
  - '@expo/config-plugins@58.0.13'
  - '@expo/config@58.0.12'
  - '@expo/env@2.6.0'
  - '@expo/fingerprint@0.21.10'
  - '@expo/image-utils@0.12.7'
  - '@expo/inline-modules@0.2.10'
  - '@expo/local-build-cache-provider@58.0.12'
  - '@expo/metro-config@58.0.23'
  - '@expo/metro-file-map@58.0.6'
  - '@expo/plist@0.10.2'
  - '@expo/prebuild-config@58.0.20'
  - '@expo/require-utils@58.0.6'
  - '@expo/router-server@58.0.23'
  - babel-preset-expo@58.0.26
  - expo-apple-authentication@58.0.3
  - expo-asset@58.0.21
  - expo-constants@58.0.16
  - expo-crypto@58.0.8
  - expo-dev-client@58.0.21
  - expo-dev-launcher@58.0.21
  - expo-dev-menu-interface@58.0.2
  - expo-dev-menu@58.0.13
  - expo-document-picker@58.0.5
  - expo-font@58.0.12
  - expo-keep-awake@58.0.4
  - expo-linking@58.0.17
  - expo-modules-autolinking@58.1.0
  - expo-modules-cli@0.5.0
  - expo-modules-core@58.1.0
  - expo-modules-jsi@58.0.23
  - expo-router@58.0.32
  - expo-secure-store@58.0.3
  - expo-server@58.1.0
  - expo-splash-screen@58.0.14
  - expo-sqlite@58.0.18
  - expo-status-bar@58.0.5
  - expo@58.0.26
  - expo-file-system@58.0.14
  - jest-expo@58.0.15
