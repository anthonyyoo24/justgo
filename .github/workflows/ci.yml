name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# New PR pushes replace older runs; main commits keep independent results.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.classify.outputs.app }}
      icloud: ${{ steps.classify.outputs.icloud }}
      dependencies: ${{ steps.classify.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A pull request that changes only Markdown skips the app jobs; static still runs.
      - name: Decide whether the app jobs run
        id: classify
        env:
          JUSTGO_CI_EVENT: ${{ github.event_name }}
          JUSTGO_CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/quality/ci-changes.mjs
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub workflow definitions
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # Validate GitHub syntax/contexts without adding separate shell/Python linters.
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - uses: ./.github/actions/setup-node
      # Mobile typechecking generates and verifies fresh Expo route declarations
      # without starting Metro, including on clean CI runners.
      - run: pnpm run check:static
  # Live Expo Doctor and the dependency audit answer from today's registry, so
  # a new release can turn them red without a commit. They run here only when a
  # PR changes what they read, and every day on main in dependency-health.yml.
  dependencies:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm --filter @justgo/mobile run doctor
      - name: Audit API production dependencies
        run: pnpm run audit:api
  unit:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Collect mobile coverage
        id: mobile-coverage
        run: pnpm --filter @justgo/mobile run test:coverage
      - name: Upload mobile coverage
        if: always() && (steps.mobile-coverage.outcome == 'success' || steps.mobile-coverage.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-mobile
          path: coverage/mobile/
          if-no-files-found: error
      - name: Collect contracts coverage
        id: contracts-coverage
        run: pnpm --filter @justgo/contracts run test:coverage
      - name: Upload contracts coverage
        if: always() && (steps.contracts-coverage.outcome == 'success' || steps.contracts-coverage.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-contracts
          path: coverage/contracts/
          if-no-files-found: error
      - name: Collect API unit coverage
        id: api-unit-coverage
        run: node scripts/quality/api-coverage.mjs unit
      - name: Upload API unit coverage
        if: always() && (steps.api-unit-coverage.outcome == 'success' || steps.api-unit-coverage.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-api-unit
          path: coverage/api-unit/
          if-no-files-found: error
  database:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 15
    env: &database-test-env
      DATABASE_URL: postgresql://justgo_runtime:runtime-ci-only@localhost:5432/justgo_test
      MIGRATION_DATABASE_URL: postgresql://justgo_migrator:migration-ci-only@localhost:5432/justgo_test
      JUSTGO_TEST_ADMIN_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/justgo_test
      DATABASE_SSL: disable
      JUSTGO_PG_BIN: /usr/lib/postgresql/17/bin
    services: &postgres-service
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: justgo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Install PostgreSQL 17 snapshot tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17 age
          /usr/lib/postgresql/17/bin/pg_dump --version
      - uses: ./.github/actions/setup-database
      - run: pnpm run db:migrate
      # Includes every integration suite and the migration rehearsal exactly once.
      - name: Collect API database coverage
        id: api-database-coverage
        run: node scripts/quality/api-coverage.mjs database
      - name: Verify Workers runtime against isolated PostgreSQL
        run: pnpm run test:workers
      - name: Rehearse encrypted recovery without resurrecting deleted data
        run: pnpm run test:backup:recovery
      - name: Upload API database coverage
        if: always() && (steps.api-database-coverage.outcome == 'success' || steps.api-database-coverage.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-api-database
          path: coverage/api-database/
          if-no-files-found: error
  journeys:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 25
    env: *database-test-env
    services: *postgres-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-database
      - uses: ./.github/actions/setup-playwright
      - name: Verify app/API/database journeys
        run: |
          pnpm run test:journey
          test -s .local/journey-report/index.html
      - name: Upload journey results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-results
          path: |
            .local/journey-results/
            .local/journey-report/
          include-hidden-files: true
          if-no-files-found: ignore
  exports:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm --filter @justgo/mobile run export:web
      - uses: ./.github/actions/setup-playwright
      - name: Verify exported web build
        run: |
          pnpm run test:exported-web
          test -s .local/exported-web-report/index.html
      - name: Upload exported web results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exported-web-results
          path: |
            .local/exported-web-results/
            .local/exported-web-report/
          include-hidden-files: true
          if-no-files-found: ignore
      - run: pnpm --filter @justgo/mobile run export:ios
  native-icloud:
    runs-on: macos-15
    needs: changes
    if: needs.changes.outputs.icloud == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native CloudKit regressions
        run: swift test --package-path apps/mobile/modules/justgo-icloud --scratch-path .local/justgo-icloud-swift --jobs 1
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      [
        changes,
        static,
        dependencies,
        unit,
        database,
        journeys,
        exports,
        native-icloud,
      ]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every producer to pass
        env:
          JUSTGO_CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/quality/api-coverage.mjs require-jobs
