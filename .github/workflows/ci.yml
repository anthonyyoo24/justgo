name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# New PR pushes replace older runs; main commits keep independent results.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm run doctor -w @justgo/mobile
      # Mobile typechecking generates and verifies fresh Expo route declarations
      # without starting Metro, including on clean CI runners.
      - run: npm run check:static
      - name: Audit API production dependencies
        run: npm audit --workspace @justgo/api --omit=dev --include-workspace-root=false --audit-level=low
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Collect mobile coverage
        id: mobile-coverage
        run: npm run test:coverage -w @justgo/mobile
      - name: Upload mobile coverage
        if: always() && (steps.mobile-coverage.outcome == 'success' || steps.mobile-coverage.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-mobile
          path: coverage/mobile/
          if-no-files-found: error
      - name: Collect contracts coverage
        id: contracts-coverage
        run: npm run test:coverage -w @justgo/contracts
      - name: Upload contracts coverage
        if: always() && (steps.contracts-coverage.outcome == 'success' || steps.contracts-coverage.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-contracts
          path: coverage/contracts/
          if-no-files-found: error
      - name: Collect API unit coverage
        id: api-unit-coverage
        run: node scripts/quality/api-coverage.mjs unit
      - name: Upload API unit coverage
        if: always() && (steps.api-unit-coverage.outcome == 'success' || steps.api-unit-coverage.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-api-unit
          path: |
            coverage/api-unit/
            coverage/api-blobs/unit.json
          if-no-files-found: error
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: &database-test-env
      DATABASE_URL: postgresql://justgo_runtime:runtime-ci-only@localhost:5432/justgo_test
      MIGRATION_DATABASE_URL: postgresql://justgo_migrator:migration-ci-only@localhost:5432/justgo_test
      DATABASE_SSL: disable
      JUSTGO_PG_BIN: /usr/lib/postgresql/17/bin
    services: &postgres-service
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: justgo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Install PostgreSQL 17 snapshot tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - uses: ./.github/actions/setup-database
      - run: npm run db:migrate
      # Includes every integration suite and the migration rehearsal exactly once.
      - name: Collect API database coverage
        id: api-database-coverage
        run: node scripts/quality/api-coverage.mjs database
      - name: Upload API database coverage
        if: always() && (steps.api-database-coverage.outcome == 'success' || steps.api-database-coverage.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-api-database
          path: |
            coverage/api-database/
            coverage/api-blobs/database.json
          if-no-files-found: error
  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: *database-test-env
    services: *postgres-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-database
      - uses: ./.github/actions/setup-playwright
      - name: Verify app/API/database journeys
        run: |
          npm run test:journey
          test -s .local/journey-report/index.html
      - name: Upload journey results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-results
          path: |
            .local/journey-results/
            .local/journey-report/
          include-hidden-files: true
          if-no-files-found: ignore
  exports:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm run export:web -w @justgo/mobile
      - uses: ./.github/actions/setup-playwright
      - name: Verify exported web build
        run: |
          npm run test:exported-web
          test -s .local/exported-web-report/index.html
      - name: Upload exported web results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exported-web-results
          path: |
            .local/exported-web-results/
            .local/exported-web-report/
          include-hidden-files: true
          if-no-files-found: ignore
      - run: npm run export:ios -w @justgo/mobile
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [static, unit, database, journeys, exports]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require every producer to pass
        env:
          JUSTGO_CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/quality/api-coverage.mjs require-jobs
      - uses: ./.github/actions/setup-node
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-mobile
          path: coverage/mobile/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-contracts
          path: coverage/contracts/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-api-*
          path: coverage/
          merge-multiple: true
      - name: Merge API execution maps and enforce all coverage floors
        id: coverage
        run: |
          node scripts/quality/api-coverage.mjs merge
          npm run coverage:check
      - name: Upload combined coverage reports
        if: always() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
