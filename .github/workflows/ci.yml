name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
  # Expo's recommended SDK patches change without a commit; catch them weekly.
  schedule:
    - cron: '0 13 * * 1'
permissions:
  contents: read
# A newer push to a pull request cancels its older run. Main and scheduled runs
# are grouped by commit, so every merged commit keeps its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  expo-doctor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - run: npm run doctor -w @justgo/mobile
  checks:
    # Doctor runs as its own job, so an upstream patch recommendation cannot
    # hide typecheck, lint, test or journey results.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: justgo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - run: npm run check:static
      - name: Install PostgreSQL 17 snapshot tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Provision isolated CI roles
        env:
          PGPASSWORD: local-ci-only
        run: |
          psql -h localhost -U postgres -d justgo_test -v ON_ERROR_STOP=1 -f apps/api/scripts/provision.sql
          psql -h localhost -U postgres -d justgo_test -v ON_ERROR_STOP=1 -c "alter role justgo_runtime password 'runtime-ci-only'; alter role justgo_migrator password 'migration-ci-only';"
      - run: npm run db:migrate
        env: &database-test-env
          DATABASE_URL: postgresql://justgo_runtime:runtime-ci-only@localhost:5432/justgo_test
          MIGRATION_DATABASE_URL: postgresql://justgo_migrator:migration-ci-only@localhost:5432/justgo_test
          DATABASE_SSL: disable
          JUSTGO_PG_BIN: /usr/lib/postgresql/17/bin
      # One run of every unit, component, contract and database suite plus the
      # migration rehearsal, collecting and enforcing coverage at the same time.
      - name: Run all workspace tests with all-source coverage (includes PostgreSQL services)
        id: coverage
        run: npm run test:coverage
        env: *database-test-env
      - name: Upload coverage reports
        if: always() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
      - name: Install journey browser
        run: npx playwright install --with-deps chromium
      - name: Verify full app/API/database journeys and recovery
        run: |
          npm run test:journey
          test -s .local/journey-report/index.html
        env: *database-test-env
      - name: Upload journey results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-results
          path: |
            .local/journey-results/
            .local/journey-report/
          if-no-files-found: ignore
      - run: npm run export:web -w @justgo/mobile
      - run: npm run export:ios -w @justgo/mobile
