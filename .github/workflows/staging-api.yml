name: Staging API release
run-name: 'Staging API ${{ inputs.operation }} from ${{ inputs.tag }}'
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag reachable from main
        required: true
        type: string
      operation:
        description: First Worker bootstrap, code-only deploy, or reviewed migrations and deploy
        required: true
        type: choice
        options: [deploy, migrate-deploy, bootstrap]
      migration_plan_sha256:
        description: Exact reviewed pending-plan digest (migrate-deploy only)
        required: false
        type: string
      abandoned_version_id:
        description: One-time code-only continuation of failed version 2d6ea61b-2714-4cd9-9437-2a73f9476dd6
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: justgo-staging-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'anthonyyoo24/justgo' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve reviewed tag and operation
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          MIGRATION_PLAN_SHA256: ${{ inputs.migration_plan_sha256 }}
          STAGING_ABANDONED_VERSION_ID: ${{ inputs.abandoned_version_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          release_sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$release_sha" refs/remotes/origin/main
          case "$RELEASE_OPERATION" in
            deploy|bootstrap) [[ -z "$MIGRATION_PLAN_SHA256" ]] || exit 1 ;;
            migrate-deploy) [[ "$MIGRATION_PLAN_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1 ;;
            *) exit 1 ;;
          esac
          if [[ -n "$STAGING_ABANDONED_VERSION_ID" ]]; then
            [[ "$RELEASE_OPERATION" == deploy && "$STAGING_ABANDONED_VERSION_ID" == 2d6ea61b-2714-4cd9-9437-2a73f9476dd6 ]] || exit 1
          fi
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
          printf 'Staging candidate: %s\nOperation: %s\n' "$release_sha" "$RELEASE_OPERATION" >> "$GITHUB_STEP_SUMMARY"
      - name: Require exact successful Foundation main push
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$RELEASE_SHA" -f event=push -f branch=main -f per_page=1 > "$RUNNER_TEMP/staging-foundation.json"
          node scripts/release/staging-api.mjs checks "$RUNNER_TEMP/staging-foundation.json"
      - name: Require owner and main-only environment protection
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVIEWER_ID: ${{ github.repository_owner_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/justgo-staging" > "$RUNNER_TEMP/staging-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/justgo-staging/deployment-branch-policies" > "$RUNNER_TEMP/staging-branches.json"
          node scripts/release/staging-api.mjs environment "$RUNNER_TEMP/staging-environment.json" "$RUNNER_TEMP/staging-branches.json"
  release:
    needs: validate
    if: github.repository == 'anthonyyoo24/justgo' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: justgo-staging
      url: ${{ vars.STAGING_WORKER_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Recheck protection before accessing provider credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVIEWER_ID: ${{ github.repository_owner_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/justgo-staging" > "$RUNNER_TEMP/staging-environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/justgo-staging/deployment-branch-policies" > "$RUNNER_TEMP/staging-branches.json"
          node scripts/release/staging-api.mjs environment "$RUNNER_TEMP/staging-environment.json" "$RUNNER_TEMP/staging-branches.json"
      - uses: ./.github/actions/setup-node
      - name: Guard database history and release exact staging candidate
        if: inputs.operation != 'bootstrap'
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          MIGRATION_PLAN_SHA256: ${{ inputs.migration_plan_sha256 }}
          STAGING_ABANDONED_VERSION_ID: ${{ inputs.abandoned_version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          STAGING_HYPERDRIVE_ID: ${{ vars.STAGING_HYPERDRIVE_ID }}
          WRANGLER_SEND_METRICS: 'false'
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          STAGING_RECOVERY_ATTESTATION: ${{ secrets.STAGING_RECOVERY_ATTESTATION }}
        run: |
          umask 077
          node --import tsx apps/api/scripts/staging-release.ts
      - name: Bootstrap the first reviewed staging Worker
        if: inputs.operation == 'bootstrap'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_OPERATION: bootstrap
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          STAGING_HYPERDRIVE_ID: ${{ vars.STAGING_HYPERDRIVE_ID }}
          STAGING_BOOTSTRAP_BINDINGS: ${{ secrets.STAGING_BOOTSTRAP_BINDINGS }}
          WRANGLER_SEND_METRICS: 'false'
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: |
          umask 077
          node --import tsx scripts/release/staging-bootstrap.mjs
      - name: Remove private release files
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP"/justgo-worker-release-* "$RUNNER_TEMP"/justgo-worker-bootstrap-*
