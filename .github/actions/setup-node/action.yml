name: Install pinned workspace dependencies
description: Use the repository Node/pnpm versions and install the root lockfile.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
    # Corepack installs the pnpm version that package.json pins.
    - id: pnpm
      run: |
        corepack enable pnpm
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.pnpm.outputs.store }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
    - run: pnpm install --frozen-lockfile
      shell: bash
