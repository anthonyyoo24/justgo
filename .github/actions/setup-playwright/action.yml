name: Install pinned journey browser
description: Cache the versioned Chromium binaries and install Linux system dependencies.
runs:
  using: composite
  steps:
    - name: Resolve installed Playwright version
      id: playwright
      run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: browser-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
    # Linux libraries are not browser-cache contents and remain required on hits.
    - run: npx playwright install-deps chromium
      shell: bash
    - if: steps.browser-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium
      shell: bash
