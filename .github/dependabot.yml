version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
    # Native/runtime major upgrades require their separately scoped build task.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # BEGIN generated by scripts/quality/dependabot-skip.mjs. Run it with --write after an Expo upgrade.
      # The Expo SDK pins these, or they ship native code. Upgrade them with the SDK.
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: '@react-native-community/netinfo'
      - dependency-name: '@react-native-google-signin/google-signin'
      - dependency-name: '@sentry/react-native'
      - dependency-name: expo
      - dependency-name: expo-apple-authentication
      - dependency-name: expo-build-properties
      - dependency-name: expo-constants
      - dependency-name: expo-crypto
      - dependency-name: expo-dev-client
      - dependency-name: expo-document-picker
      - dependency-name: expo-file-system
      - dependency-name: expo-font
      - dependency-name: expo-image
      - dependency-name: expo-linking
      - dependency-name: expo-router
      - dependency-name: expo-secure-store
      - dependency-name: expo-splash-screen
      - dependency-name: expo-sqlite
      - dependency-name: expo-status-bar
      - dependency-name: jest-expo
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-pulsar
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-screens
      - dependency-name: react-native-svg
      - dependency-name: react-native-web
      - dependency-name: react-native-worklets
      # END generated
