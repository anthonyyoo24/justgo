version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directories:
      - /
      - /scripts/release/vercel-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
    # Native/runtime major upgrades require their separately scoped build task.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
