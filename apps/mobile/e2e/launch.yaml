appId: ${APP_ID}
---
- launchApp
- openLink: 'justgo://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081'
- extendedWaitUntil:
    visible: 'We can’t verify access yet.'
    timeout: 60000
- tapOn: 'Account & recovery'
- extendedWaitUntil:
    visible: 'ACCOUNT & RECOVERY'
    timeout: 30000
- scrollUntilVisible:
    element: 'Refresh account'
    direction: DOWN
- tapOn: 'Refresh account'
- extendedWaitUntil:
    visible: 'Connected'
    timeout: 15000
